name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: bookstore
  POSTGRES_PASSWORD: bookstore
  POSTGRES_DB: bookstore
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ci-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.7.0
      - run: ruff check services/ shared/ tests/ || true

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [identity, catalog, inventory, sales]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Unit tests (${{ matrix.service }})
        working-directory: services/${{ matrix.service }}
        run: pytest tests/unit -v

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/e2e/requirements.txt
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for stack
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health >/dev/null 2>&1 && \
            curl -sf http://localhost:8002/health >/dev/null 2>&1 && \
            curl -sf http://localhost:8003/health >/dev/null 2>&1 && \
            curl -sf http://localhost:8004/health >/dev/null 2>&1 && break;
            echo "waiting for stack ($i/30)..."; sleep 3;
          done
      - name: Run e2e saga tests
        env:
          RUN_E2E: "1"
        run: pytest tests/e2e -v
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  build:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        service: [identity, catalog, inventory, sales]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/${{ matrix.service }}/Dockerfile -t bookstore/${{ matrix.service }}:${{ github.sha }} .

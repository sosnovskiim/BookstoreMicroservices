# Compose-файл: инфраструктура + сервисы.
services:
  # PostgreSQL — одна БД, но с разными схемами под каждый контекст.
  # init-скрипты из ./db/init применяются ТОЛЬКО при первом старте тома.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — кеш каталога (требование 5).
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # RabbitMQ — шина событий для outbox/inbox и саги (требования 7–9).
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports: ["5672:5672", "15672:15672"]  # 15672 — веб-UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s

  # Identity — единый сервис аутентификации (требование 11).
  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }

  # Catalog — каталог книг и отзывов. HTTP + gRPC + Redis-кеш.
  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    ports:
      - "8002:8000"  # HTTP (Swagger)
      - "50051:50051"  # gRPC (для Sales)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Sales — оформление заказов, gRPC-клиент в Catalog, обе половины саги.
  sales:
    build:
      context: .
      dockerfile: services/sales/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    ports: ["8003:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      catalog:  { condition: service_started }

  # Inventory — остатки и закупки. Consumer + outbox + inbox через RabbitMQ.
  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    ports: ["8004:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  pgdata:
